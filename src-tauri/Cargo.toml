[package]
name = "mtg-local-first"
version = "0.1.0"
description = "A local-first Magic: The Gathering collection manager"
authors = ["MTG Local-First contributors"]
edition = "2021"

[lib]
name = "mtg_local_first_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
